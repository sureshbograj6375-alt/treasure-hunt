<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt</title>
<style>
body {
  background: linear-gradient(#174c32,#071e18);
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 15px;
}
h1 {color: gold;font-size: 32px;}
p {font-size: 18px;}
.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
  max-width: 350px;
  margin: 25px auto;
}
.box {
  height: 95px;
  font-size: 38px;
  background: #9b642e;
  border: 3px solid gold;
  border-radius: 15px;
}
button {cursor:pointer;}
#message {color: gold;font-weight:bold;}
#restart {
  padding: 13px 25px;
  border: 0;
  border-radius: 10px;
  background: gold;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>💎 TREASURE HUNT</h1>
<p>Find the Hidden Treasure!</p>

<h2>🪙 Coins: <span id="coins">0</span></h2>
<h3>Level: <span id="level">1</span></h3>

<div class="grid" id="grid"></div>

<h3 id="message">Choose a Treasure Box!</h3>

<button id="restart" onclick="startGame()">Restart Game</button>

<script>
let coins = 0;
let level = 1;
let found = 0;
let tries = 3;
let treasures = [];

function startGame() {
  found = 0;
  tries = 3;
  treasures = [];

  let count = Math.min(2 + Math.floor((level-1)/2),5);

  while(treasures.length < count) {
    let n = Math.floor(Math.random()*9);
    if(!treasures.includes(n)) treasures.push(n);
  }

  document.getElementById("grid").innerHTML = "";
  document.getElementById("message").innerText = "Find the treasure!";

  for(let i=0;i<9;i++) {
    let b = document.createElement("button");
    b.className = "box";
    b.innerText = "📦";

    b.onclick = function() {
      if(b.disabled) return;
      b.disabled = true;

      if(treasures.includes(i)) {
        b.innerText = "💎";
        coins += 10*level;
        found++;
        document.getElementById("message").innerText = "Amazing! Treasure Found!";
      } else {
        b.innerText = "🪨";
        tries--;
        document.getElementById("message").innerText = "Empty Box! Chances left: "+tries;
      }

      document.getElementById("coins").innerText = coins;

      if(found === count) {
        document.getElementById("message").innerText = "🏆 Level Complete!";
        level++;
        document.getElementById("level").innerText = level;
        document.querySelectorAll(".box").forEach(x=>x.disabled=true);
      }

      if(tries === 0) {
        document.getElementById("message").innerText = "Game Over! Restart to play again.";
      }
    };

    document.getElementById("grid").appendChild(b);
  }
}

startGame();
</script>
</body>
</html>
