<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jungle Quest</title>
<style>
body{margin:0;background:#102d19;color:white;text-align:center;font-family:Arial}
h2{color:gold}
canvas{width:100%;max-width:800px;background:skyblue}
button{font-size:28px;padding:12px 22px;margin:8px;border:0;border-radius:12px;background:orange}
</style>
</head>
<body>
<h2>🌴 JUNGLE QUEST 🌴</h2>
<p>❤️ <span id="life">3</span> | 🪙 <span id="score">0</span></p>
<canvas id="game" width="800" height="400"></canvas>
<br>
<button id="left">⬅️</button>
<button id="jump">⬆️</button>
<button id="right">➡️</button>
<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
let p={x:50,y:280,w:35,h:45,vy:0,ground:false};
let coins=[180,300,430,550,680].map(x=>({x,y:300}));
let enemy={x:450,y:320,d:1};
let score=0,life=3,over=false,win=false;
let keys={left:false,right:false};

function control(id,key){
let b=document.getElementById(id);
b.onpointerdown=e=>{e.preventDefault();keys[key]=true};
b.onpointerup=()=>keys[key]=false;
b.onpointerleave=()=>keys[key]=false;
}
control("left","left");
control("right","right");

document.getElementById("jump").onclick=()=>{
if(p.ground&&!over&&!win){p.vy=-12;p.ground=false;}
};

function draw(){
ctx.clearRect(0,0,800,400);
ctx.fillStyle="#176b2c";
for(let i=0;i<8;i++){
ctx.fillRect(i*110,170,20,180);
ctx.beginPath();
ctx.arc(i*110+10,165,45,0,7);
ctx.fill();
}
ctxfor(let i=0;i<8;i++){
ctx.fillRect(i*110,170,20,180);
ctx.beginPath();
ctx.arc(i*110+10,165,45,0,7);
ctx.fill();
}
ctx.fillStyle="#80552e";
ctx.fillRect(0,350,800,50);

coins.forEach(a=>{
ctx.fillStyle="gold";
ctx.beginPath();ctx.arc(a.x,a.y,10,0,7);ctx.fill();
});

ctx.fillStyle="#222";
ctx.fillRect(enemy.x,enemy.y,35,30);

ctx.fillStyle="red";
ctx.fillRect(p.x,p.y,p.w,p.h);
ctx.fillStyle="#ffdbac";
ctx.fillRect(p.x+7,p.y-15,23,20);

document.getElementById("score").textContent=score;
document.getElementById("life").textContent=life;
}

function update(){
if(over||win)return;
if(keys.left)p.x-=4;
if(keys.right)p.x+=4;
p.x=Math.max(0,Math.min(765,p.x));

p.vy+=.6;p.y+=p.vy;
if(p.y+p.h>=350){p.y=305;p.vy=0;p.ground=true;}

enemy.x+=enemy.d*2;
if(enemy.x>730||enemy.x<300)enemy.d*=-1;

coins=coins.filter(a=>{
let hit=p.x<a.x+12&&p.x+p.w>a.x-12&&
p.y<a.y+12&&p.y+p.h>a.y-12;
if(hit)score+=10;
return !hit;
});if(p.x<enemy.x+35&&p.x+35>enemy.x&&
p.y<enemy.y+30&&p.y+45>enemy.y){
life--;p.x=50;
if(life<=0)over=true;
}
if(coins.length===0)win=true;
}

function loop(){
update();draw();
if(over||win){
ctx.fillStyle="black";
ctx.font="40px Arial";
ctx.textAlign="center";
ctx.fillText(over?"GAME OVER":"LEVEL COMPLETE!",400,200);
}
requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft")keys.left=true;
if(e.key==="ArrowRight")keys.right=true;
if(e.key==="ArrowUp"||e.key===" "){
if(p.ground){p.vy=-12;p.ground=false;}
}
});
document.addEventListener("keyup",e=>{
if(e.key==="ArrowLeft")keys.left=false;
if(e.key==="ArrowRight")keys.right=false;
});
loop();
</script>
</body>
</html>
