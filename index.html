<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Hero 3D</title>
<style>
body {
 margin:0;
 overflow:hidden;
 background:#07130d;
 font-family:Arial;
}
#hud {
 position:absolute;
 top:10px;
 left:10px;
 right:10px;
 display:flex;
 justify-content:space-between;
 color:gold;
 z-index:5;
}
#hud span {
 background:#111;
 padding:10px;
 border:1px solid gold;
 border-radius:10px;
}
#controls {
 position:absolute;
 bottom:15px;
 left:15px;
 display:grid;
 grid-template-columns:55px 55px 55px;
 gap:5px;
 z-index:5;
}
button {
 background:#111;
 color:gold;
 border:1px solid gold;
 border-radius:10px;
 padding:12px;
 font-size:20px;
 touch-action:none;
}
#up {grid-column:2}
#left {grid-column:1}
#right {grid-column:3}
#down {grid-column:2}
</style>
</head>
<body>

<div id="hud">
<span>❤️ <b id="life">3</b></span>
<span>🪙 <b id="coin">0</b></span>
<span>⭐ Level <b id="level">1</b></span>
</div>

<div id="controls">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="right">▶</button>
<button id="down">▼</button>
</div>
