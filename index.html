<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Superhero Jungle Adventure</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#071b16;
 color:white;
 font-family:Arial,sans-serif;
 touch-action:none;
}
canvas{display:block}

#hud{
 position:absolute;
 top:10px;
 left:10px;
 z-index:5;
 padding:10px;
 background:#101c19eF;
 border:2px solid gold;
 border-radius:12px;
 font-weight:bold;
 line-height:1.7;
 font-size:15px;
}

#msg{
 position:absolute;
 top:115px;
 left:50%;
 transform:translateX(-50%);
 z-index:5;
 width:90%;
 text-align:center;
 background:#101c19dd;
 color:gold;
 padding:12px;
 border-radius:12px;
 font-weight:bold;
}

#restart{
 position:absolute;
 top:10px;
 right:10px;
 z-index:6;
 background:#171717;
 color:white;
 border:2px solid gold;
 border-radius:12px;
 padding:12px;
 font-weight:bold;
}

#controls{
 position:absolute;
 bottom:18px;
 left:0;
 right:0;
 z-index:6;
 display:flex;
 justify-content:space-between;
 padding:0 12px;
}

.group{
 display:flex;
 gap:7px;
}

button{
 background:#171717;
 color:white;
 border:2px solid gold;
 border-radius:13px;
 min-width:52px;
 min-height:55px;
 font-size:22px;
 font-weight:bold;
 touch-action:none;
}

button:active{
 background:gold;
 color:black;
}
</style>
</head>

<body>

<div id="hud">
🦸 SUPERHERO HUNT<br>
❤️ Health: <span id="health">100</span><br>
🪙 Coins: <span id="coins">0</span><br>
🔑 Key: <span id="key">No</span>
</div>

<div id="msg">
Welcome to Jungle Adventure! Collect coins and find the treasure.
</div>

<button id="restart" onclick="location.reload()">↻ Restart</button>

<div id="controls">
 <div class="group">
  <button id="left">⬅</button>
  <button id="right">➡</button>
 </div>
 <div class="group">
  <button id="shield">🛡</button>
  <button id="forward">⬆</button>
  <button id="back">⬇</button>
 </div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,110);

// CAMERA
const camera=new THREE.PerspectiveCamera(
 80,innerWidth/innerHeight,0.1,200
);
camera.position.set(0,7,17);

// RENDERER
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.HemisphereLight(0xffffff,0x335522,2));

const sun=new THREE.DirectionalLight(0xffedbb,2.5);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

// HELPERS
const $=id=>document.getElementById(id);

const material=color=>
 new THREE.MeshStandardMaterial({color});

const green=material(0x08752c);
const lightGreen=material(0x20a83b);
const brown=material(0x654321);
const gold=material(0xffcc22);
const red=material(0xe51b23);
const blue=material(0x0755dd);
const skin=material(0xffc18a);

let coins=0;
let health=100;
let hasKey=false;
let shieldTime=0;
let gameOver=false;
let messageTime=0;

function message(text){
 $('msg').textContent=text;
 messageTime=3;
}

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,160),
 material(0x176b27)
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.1,-45);
scene.add(ground);

// ROAD
const road=new THREE.Mesh(
 new THREE.BoxGeometry(5,0.15,160),
 material(0x9b7847)
);
road.position.set(0,0,-45);
scene.add(road);

// RIVER
const river=new THREE.Mesh(
 new THREE.BoxGeometry(5,0.12,160),
 new THREE.MeshStandardMaterial({
  color:0x0088dd,
  metalness:0.3,
  roughness:0.2
 })
);
river.position.set(9,0,-45);
scene.add(river);

// TREES
function tree(x,z,size=1){

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(
   0.25*size,0.4*size,3*size,8
  ),
  brown
 );

 trunk.position.set(x,1.5*size,z);
 trunk.castShadow
 </script>
</body>
</html>
