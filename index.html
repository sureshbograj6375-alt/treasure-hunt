<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Superhero Jungle Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071b16;color:white;font-family:Arial}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#111e;border:2px solid gold;border-radius:12px;padding:10px;line-height:1.7;z-index:2;font-weight:bold}
#msg{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:#111e;color:gold;padding:12px;border-radius:10px;text-align:center;width:90%;z-index:2}
#controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:3}
.group{display:flex;gap:7px}
button{background:#171717;color:white;border:2px solid gold;border-radius:12px;padding:14px;font-size:19px;font-weight:bold;min-width:52px}
#restart{position:absolute;right:10px;top:10px;z-index:3}
</style>
</head>
<body>

<div id="hud">
🦸 SUPERHERO HUNT<br>
❤️ Health: <span id="health">100</span><br>
🪙 Coins: <span id="coins">0</span><br>
🔑 Key: <span id="key">No</span>
</div>

<div id="msg">Welcome to Jungle Adventure!</div>
<button id="restart" onclick="location.reload()">↻ Restart</button>

<div id="controls">
<div class="group">
<button id="left">⬅</button>
<button id="right">➡</button>
</div>
<div class="group">
<button id="shield">🛡</button>
<button id="forward">⬆</button>
<button id="back">⬇</button>
</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,100);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,200
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x334422,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

const $=id=>document.getElementById(id);

let coins=0,health=100,hasKey=false;
let shieldTime=0,gameOver=false,messageTime=0;

function message(t){
 $('msg').textContent=t;
 messageTime=3;
}

function mat(color){
 return new THREE.MeshStandardMaterial({color});
}

const green=mat(0x176b27);
const brown=mat(0x654321);
const gold=mat(0xffcc22);
const red=mat(0xe51b23);
const blue=mat(0x0755dd);

function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,150),
 mat(0x176b27)
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.1,-40);
scene.add(ground);

// JUNGLE ROAD
const road=new THREE.Mesh(
 new THREE.BoxGeometry(5,0.12,150),
 mat(0x9b7847)
);
road.position.set(0,0,-40);
scene.add(road);

// RIVER
const river=new THREE.Mesh(
 new THREE.BoxGeometry(5,0.1,150),
 new THREE.MeshStandardMaterial({
  color:0x0088dd,metalness:0.3,roughness:0.2
 })
);
river.position.set(9,0,-40);
scene.add(river);

// TREES
function tree(x,z,size=1){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(
   0.25*size,0.4*size,3*size,8
  ),brown
 );
 trunk.position.set(x,1.5*size,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.8*size,4*size,8),
  green
 );
 leaves.position.set(x,4*size,z);
 scene.add(leaves);

 const leaves2=new THREE.Mesh(
  new THREE.ConeGeometry(1.3*size,3*size,8),
  mat(0x238b32)
 );
 leaves2.position.set(x,5*size,z);
 scene.add(leaves2);
}

for(let z=12;z>=-115;z-=6){
 tree(-4.5,z,1);
 tree(4.5,z,1);
 tree(-7,z-2,1.2);
 tree(7,z-2,1.2);
}

// HERO
const hero=new THREE.Group();
scene.add(hero);

const skin=mat(0xffc18a);

box(hero,0.9,1.2,0.5,blue,0,1.5,0);
box(hero,0.65,0.65,0.55,skin,0,2.45,0);
box(hero,0.7,0.2,0.6,red,0,2.65,0);
box(hero,1.1,0.2,0.55,gold,0,2.05,0);
box(hero,0.35,0.9,0.35,red,-0.3,0.45,0);
box(hero,0.35,0.9,0.35,red,0.3,0.45,0);
box(hero,0.3,0.8,0.35,blue,-0.65,1.5,0);
box(hero,0.3,0.8,0.35,blue,0.65,1.5,0);

hero.position.set(0,0,5);

// SNAKES
const snakes=[];
for(let i=0;i<8;i++){
 const s=new THREE.Mesh(
  new THREE.TorusGeometry(0.45,0.13,8,16),
  mat(0x22cc55)
 );
 s.position.set(i%2===0?-2:2,0.3,-10-i*10);
 scene.add(s);
 snakes.push(s);
}

// COINS
const coinObjects=[];
for(let i=0;i<12;i++){
 const c=new THREE.Mesh(
  new THREE.TorusGeometry(0.4,0.12,12,24),
  gold
 );
 c.position.set(i%2===0?-1.5:1.5,1,-5-i*7);
 scene.add(c);
 coinObjects.push(c);
}

// KEY
const key=new THREE.Group();
key.add(new THREE.Mesh(
 new THREE.TorusGeometry(0.35,0.1,12,24),gold
));
box(key,0.15,0.9,0.15,gold,0,-0.5,0);
key.position.set(0,1,-75);
scene.add(key);

// TREASURE CHEST
const chest=new THREE.Group();
box(chest,2,1.2,1.2,mat(0x8b4513),0,0.6,0);
box(chest,2.05,0.25,1.25,gold,0,1.25,0);
box(chest,0.35,0.45,0.15,gold,0,0.85,0);
chest.position.set(0,0,-95);
scene.add(chest);

// CONTROLS
const keys={left:false,right:false,forward:false,back:false};

function bind(id,name){
 const b=$(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[name]=true;
 });
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  b.addEventListener(ev,()=>keys[name]=false);
 });
}

bind('left','left');
bind('right','right');
bind('forward','forward');
bind('back','back');

$('shield').addEventListener('pointerdown',()=>{
 shieldTime=5;
 message('Shield activated!');
});

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.05);
 const t=clock.elapsedTime;

 if(!gameOver){

  if(keys.left)hero.position.x-=5*dt;
  if(keys.right)hero.position.x+=5*dt;
  if(keys.forward)hero.position.z-=7*dt;
  if(keys.back)hero.position.z+=7*dt;

  hero.position.x=THREE.MathUtils.clamp(hero.position.x,-2,2);
  hero.position.z=THREE.MathUtils.clamp(hero.position.z,-100,5);

  if(shieldTime>0)shieldTime-=dt;

  coinObjects.forEach(c=>{
   if(!c.visible)return;
   c.rotation.y+=dt*3;

   if(c.position.distanceTo(hero.position)<2){
    c.visible=false;
    coins++;
    $('coins').textContent=coins;
    message('Coin collected!');
   }
  });

  key.rotation.y+=dt*2;

  if(key.visible&&key.position.distanceTo(hero.position)<2){
   key.visible=false;
   hasKey=true;
   $('key').textContent='Yes';
   message('Golden key found!');
  }

  if(chest.visible&&chest.position.distanceTo(hero.position)<3){
   if(hasKey){
    chest.visible=false;
    message('YOU WIN! TREASURE UNLOCKED!');
    gameOver=true;
   }else{
    message('Find the golden key first!');
   }
  }

  snakes.forEach(s=>{
   s.position.x+=Math.sin(t*2+s.position.z)*dt*0.7;

   if(s.position.distanceTo(hero.position)<1.5&&shieldTime<=0){
    health-=20*dt;
    $('health').textContent=Math.max(0,Math.floor(health));
   }
  });

  if(health<=0){
   health=0;
   gameOver=true;
   message('GAME OVER! Press Restart.');
  }

  if(messageTime>0){
   messageTime-=dt;
   if(messageTime<=0&&!gameOver){
    $('msg').textContent='Find the key and reach the treasure!';
   }
  }
 }

 camera.position.set(
  hero.position.x*0.35,
  7,
  hero.position.z+12
 );
 camera.lookAt(hero.position.x,1,hero.position.z-5);

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
