<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Superhero Jungle Adventure</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071b16;color:white;font-family:Arial}
canvas{display:block}
#hud{
 position:absolute;top:10px;left:10px;
 background:#111e;border:2px solid gold;
 border-radius:12px;padding:10px;
 line-height:1.7;z-index:2;font-weight:bold
}
#msg{
 position:absolute;top:120px;left:50%;
 transform:translateX(-50%);
 background:#111e;color:gold;padding:12px;
 border-radius:10px;text-align:center;width:90%;z-index:2
}
#controls{
 position:absolute;bottom:15px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:0 15px;z-index:3
}
.group{display:flex;gap:7px}
button{
 background:#171717;color:white;border:2px solid gold;
 border-radius:12px;padding:14px;font-size:19px;
 font-weight:bold;min-width:52px
}
#restart{position:absolute;right:10px;top:10px;z-index:3}
</style>
</head>

<body>

<div id="hud">
🦸 SUPERHERO HUNT<br>
❤️ Health: <span id="health">100</span><br>
🪙 Coins: <span id="coins">0</span><br>
🔑 Key: <span id="key">No</span>
</div>

<div id="msg">Jungle adventure begins! Collect coins and find the treasure.</div>

<button id="restart" onclick="location.reload()">↻ Restart</button>

<div id="controls">
 <div class="group">
  <button id="left">⬅</button>
  <button id="right">➡</button>
 </div>
 <div class="group">
  <button id="shield">🛡</button>
  <button id="forward">⬆</button>
  <button id="back">⬇</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071b16);
scene.fog=new THREE.Fog(0x071b16,35,100);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,200
);
camera.position.set(0,7,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x334422,2));

const sun=new THREE.DirectionalLight(0xffdd99,3);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

const $=id=>document.getElementById(id);

let coins=0;
let health=100;
let hasKey=false;
let shieldTime=0;
let gameOver=false;
let messageTime=0;

function message(t){
 $('msg').textContent=t;
 messageTime=3;
}

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,120),
 new THREE.MeshStandardMaterial({color:0x174d26})
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.1,-25);
scene.add(ground);

// JUNGLE PATH
const path=new THREE.Mesh(
 new THREE.BoxGeometry(5,0.1,120),
 new THREE.MeshStandardMaterial({color:0x9b7847})
);
path.position.set(0,0,-25);
scene.add(path);

// RIVER
const river=new THREE.Mesh(
 new THREE.BoxGeometry(5,0.08,120),
 new THREE.MeshStandardMaterial({color:0x087eae})
);
river.position.set(8,0.02,-25);
scene.add(river);

// TREE FUNCTION
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(0.25,0.4,3,8),
  new THREE.MeshStandardMaterial({color:0x654321})
 );
 trunk.position.set(x,1.4,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.8,4,8
                         // SNAKES
const snakeMat=new THREE.MeshStandardMaterial({color:0x22cc55});

for(let i=0;i<8;i++){
 const snake=new THREE.Mesh(
  new THREE.TorusGeometry(0.5,0.12,8,16),
  snakeMat
 );
 snake.position.set(
  THREE.MathUtils.randFloat(-2,2),
  0.3,
  -10-i*10
 );
 scene.add(snake);
 snakes.push(snake);
}

// GOLD COINS
const coinMat=new THREE.MeshStandardMaterial({
 color:0xffcc00,
 metalness:0.8,
 roughness:0.2
});

for(let i=0;i<12;i++){
 const coin=new THREE.Mesh(
  new THREE.TorusGeometry(0.4,0.12,12,24),
  coinMat
 );
 coin.position.set(
  THREE.MathUtils.randFloat(-2,2),
  1,
  -5-i*7
 );
 scene.add(coin);
 coinObjects.push(coin);
}

// GOLDEN KEY
const key=new THREE.Group();

const keyRing=new THREE.Mesh(
 new THREE.TorusGeometry(0.35,0.1,12,24),
 gold
);
key.add(keyRing);

const keyStick=box(key,0.16,0.9,0.15,gold,0,-0.55,0);
keyStick.rotation.z=Math.PI/2;

key.position.set(0,1,-75);
scene.add(key);

// TREASURE CHEST
const chest=new THREE.Group();

box(chest,2,1.2,1.2,
 new THREE.MeshStandardMaterial({color:0x8b4513}),
 0,0.6,0
);

box(chest,2.05,0.25,1.25,gold,0,1.25,0);

const lock=box(chest,0.35,0.45,0.15,gold,0,0.85,0);

chest.position.set(0,0,-95);
scene.add(chest);
 // CONTROLS
const keys={};

function bind(id,name){
 const b=$(id);

 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[name]=true;
 });

 ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  b.addEventListener(ev,()=>keys[name]=false);
 });
}

bind('left','left');
bind('right','right');
bind('forward','forward');
bind('back','back');

$('shield').addEventListener('pointerdown',()=>{
 shieldTime=5;
 message('Shield activated!');
});

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')keys.left=true;
 if(e.key==='ArrowRight')keys.right=true;
 if(e.key==='ArrowUp')keys.forward=true;
 if(e.key==='ArrowDown')keys.back=true;
});

addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft')keys.left=false;
 if(e.key==='ArrowRight')keys.right=false;
 if(e.key==='ArrowUp')keys.forward=false;
 if(e.key==='ArrowDown')keys.back=false;
});

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.05);
 const t=clock.elapsedTime;

 if(!gameOver){

  if(keys.left)hero.position.x-=5*dt;
  if(keys.right)hero.position.x+=5*dt;
  if(keys.forward)hero.position.z-=7*dt;
  if(keys.back)hero.position.z+=7*dt;

  hero.position.x=THREE.MathUtils.clamp(hero.position.x,-2,2);
  hero.position.z=THREE.MathUtils.clamp(hero.position.z,-100,5);

  if(shieldTime>0)shieldTime-=dt;

  coinObjects.forEach(c=>{
   if(!c.visible)return;

   c.rotation.y+=dt*3;

   if(c.position.distanceTo(hero.position)<1.8){
    c.visible=false;
    coins++;
    $('coins').textContent=coins;
    message('Coin collected!');
   }
  });

  key.rotation.y+=dt*2;

  if(key.visible&&key.position.distanceTo(hero.position)<2){
   key.visible=false;
   hasKey=true;
   $('key').textContent='Yes';
   message('Golden key found!');
  }

  if(chest.visible&&chest.position.distanceTo(hero.position)<3){
   if(hasKey){
    chest.visible=false;
    message('🏆 YOU WIN! TREASURE UNLOCKED!');
    gameOver=true;
   }else{
    message('Find the golden key first!');
   }
  }

  snakes.forEach(s=>{
   s.position.x+=Math.sin(t*2+s.position.z)*dt*0.7;

   if(s.position.distanceTo(hero.position)<1.5&&shieldTime<=0){
    health-=20*dt;
    $('health').textContent=Math.max(0,Math.floor(health));
   }
  });

  if(health<=0){
   health=0;
   gameOver=true;
   message('GAME OVER! Press Restart.');
  }

  if(messageTime>0){
   messageTime-=dt;

   if(messageTime<=0&&!gameOver){
    $('msg').textContent='Find the key and reach the treasure!';
   }
  }
 }

 camera.position.x=hero.position.x*0.35;
 camera.position.z=hero.position.z+10;
 camera.position.y=7;
 camera.lookAt(hero.position.x,1,hero.position.z-4);

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
