<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Superhero Treasure Hunt</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071b16;color:white;font-family:Arial}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#111e;border:1px solid gold;border-radius:12px;padding:12px;line-height:1.7;z-index:2;font-weight:bold}
#msg{position:absolute;top:115px;left:50%;transform:translateX(-50%);background:#111e;color:gold;padding:12px;border-radius:10px;text-align:center;width:90%;z-index:2}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:3}
.group{display:flex;gap:7px}
button{background:#171717;color:white;border:2px solid gold;border-radius:12px;padding:14px;font-size:19px;font-weight:bold;min-width:52px}
button:active{background:gold;color:black}
#restart{position:absolute;right:10px;top:10px;z-index:3;font-size:14px}
</style>
</head>
<body>

<div id="hud">
🦸 SUPERHERO HUNT<br>
❤️ Health: <span id="health">100</span><br>
🪙 Coins: <span id="coins">0</span><br>
🔑 Key: <span id="key">No</span>
</div>

<div id="msg">Collect coins, find the key and open the treasure!</div>
<button id="restart" onclick="location.reload()">↻ Restart</button>

<div id="controls">
<div class="group">
<button id="left">⬅</button>
<button id="right">➡</button>
</div>
<div class="group">
<button id="shield">🛡</button>
<button id="forward">⬆</button>
<button id="back">⬇</button>
</div>
</div>

bind('back','back');

});
