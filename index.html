<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Car Racing</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101820;color:white;
 font-family:Arial;text-align:center;
}
h2{color:#ffcc00;margin:12px}
#game{
 display:block;width:100%;max-width:420px;
 height:auto;margin:auto;
 background:#333;border:3px solid white;
}
.info{font-size:18px;margin:8px}
.controls{
 display:flex;justify-content:center;
 gap:15px;margin:15px;
}
button{
 background:#ffbd24;border:0;
 border-radius:12px;padding:15px 25px;
 font-size:25px;font-weight:bold;
}
#start{font-size:18px}
</style>
</head>
<body>

<h2>🏎️ SUPER CAR RACING</h2>

<div class="info">
 SCORE: <span id="score">0</span>
 | COINS: <span id="coins">0</span>
</div>

<canvas id="game" width="400" height="600"></canvas>

<button id="start">START GAME</button>

<div class="controls">
<button id="left">⬅️</button>
<button id="right">➡️</button>
<button id="boost">⚡</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let car={x:180,y:490,w:40,h:75};
let enemies=[];
let coins=[];
let score=0;
let coinCount=0;
let speed=5;
let running=false;
let gameOver=false;
let left=false,right=false;
let road=0;
let frame=0;
let boosting=false;

function drawCar(x,y,color){
ctx.fillStyle=color;
ctx.fillRect(x,y,40,75);

ctx.fillStyle="#111";
ctx.fillRect(x+5,y+12,30,20);

ctx.fillStyle="#ddd";
ctx.fillRect(x+7,y+40,26,13);

ctx.fillStyle="yellow";
ctx.fillRect(x+3,y+2,8,5);
ctx.fillRect(x+29,y+2,8,5);
ctx.fillStyle="#111";
ctx.fillRect(x-4,y+12,5,16);
ctx.fillRect(x+39,y+12,5,16);
ctx.fillRect(x-4,y+52,5,16);
ctx.fillRect(x+39,y+52,5,16);
